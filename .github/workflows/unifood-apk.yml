name: Build UNIFOOD Hygiene APK

# Builds the signed Android APK of unifood-hygiene-app/ and keeps it as a download
# (Actions → this run → Artifacts → unifood-hygiene-apk).

on:
  push:
    paths: ["unifood-hygiene-app/**", ".github/workflows/unifood-apk.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unifood-hygiene-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: unifood-hygiene-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      # the Firebase settings are kept out of git: add them as the repository secret FIREBASE_CONFIG_JS
      # (the full content of src/firebase-config.js)
      - run: printf '%s' "$CFG" > src/firebase-config.js
        env:
          CFG: ${{ secrets.FIREBASE_CONFIG_JS }}
      - run: npx vite build && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: unifood-hygiene-apk
          path: unifood-hygiene-app/android/app/build/outputs/apk/release/*.apk
