<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEEEEC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>مشوار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="stage">
  <main class="app" id="app">
    <div class="map" id="map" aria-label="الخريطة"></div>
    <div class="map-fade"></div>

    <header class="topbar" id="topbar">
      <button class="me-btn" id="meBtn" data-action="open-profile" aria-label="حسابي"></button>
      <div class="loc">
        <small id="locIcon">موقعك الحالي</small>
        <strong id="locText">شارع النصر، مدينة نصر</strong>
      </div>
      <button class="round" id="menuBtn" data-action="menu" aria-label="القائمة"></button>
    </header>

    <div class="center-pin" id="centerPin" hidden>
      <div class="stick"><div class="head"></div><div class="bar"></div></div>
      <div class="shadow"></div>
    </div>

    <button class="round fab" id="fab" data-action="recenter" aria-label="رجوع لموقعي"></button>
    <button class="fab fab-skip hide" id="skipBtn" data-action="skip" aria-label="تسريع المرحلة (للتجربة)"></button>

    <div class="scrim" id="scrim" data-action="collapse-sheet"></div>
    <section class="sheet" id="sheet" aria-live="polite">
      <div class="sheet-grab" id="sheetGrab"><div class="sheet-handle"></div></div>
      <div class="sheet-scroll" id="sheetScroll"><div class="sheet-body" id="sheetBody"></div></div>
    </section>
    <div class="sheet-foot" id="sheetFoot"></div>

    <div class="pages" id="pages"></div>
    <div class="modal-root" id="modalRoot"></div>
    <div class="toast-root" id="toastRoot"></div>

    <div class="splash" id="splash">
      <div>
        <div id="splashCar"></div>
        <div class="logo">مشوار<i></i></div>
        <small>مشوارك… بأناقة</small>
      </div>
    </div>
  </main>
</div>

<script src="js/assets.js"></script>
<script src="js/icon-set.js"></script>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/map.js"></script>
<script src="js/mock-api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
