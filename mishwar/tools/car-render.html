<!doctype html>
<html><body style="margin:0;background:#888">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8f99, 0.6);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(2, 8, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4; sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -4;
sun.shadow.radius = 8;
sun.shadow.bias = -0.0005;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// soft contact shadow under the car
const cs = document.createElement('canvas'); cs.width = cs.height = 256;
const cx = cs.getContext('2d');
const g = cx.createRadialGradient(128, 128, 10, 128, 128, 128);
g.addColorStop(0, 'rgba(0,0,0,0.55)'); g.addColorStop(0.55, 'rgba(0,0,0,0.22)'); g.addColorStop(1, 'rgba(0,0,0,0)');
cx.fillStyle = g; cx.fillRect(0, 0, 256, 256);
const contact = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 2.6), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cs), transparent: true, depthWrite: false }));
contact.rotation.x = -Math.PI / 2; contact.position.y = 0.002;
scene.add(contact);
const contact2 = new THREE.Mesh(new THREE.PlaneGeometry(4.9, 1.95), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cs), transparent: true, depthWrite: false, opacity: 0.9 }));
contact2.rotation.x = -Math.PI / 2; contact2.position.y = 0.003;
scene.add(contact2);

function extrude(shape, depth, bevel, segs) {
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: segs || 8, curveSegments: 40 });
  geo.translate(0, 0, -depth / 2);
  const m = mergeVertices(geo, 1e-4);
  m.computeVertexNormals();
  return m;
}

// taper an extruded part so it reads as a car body instead of a box
function shape3d(geo, opts) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i);
    let z = p.getZ(i);
    const ax = Math.abs(x);
    const end = Math.min(1, Math.max(0, (ax - opts.endFrom) / (opts.endTo - opts.endFrom)));
    let k = 1 - opts.top * Math.max(0, y - opts.y0) - opts.ends * end * end;
    z *= k;
    let yy = y;
    // drop the hood/deck toward the sides
    const side = Math.abs(z) / (opts.halfW || 1);
    if (y > opts.y0) yy -= opts.crown * side * side * Math.min(1, (y - opts.y0) * 3);
    p.setXYZ(i, x, yy, z);
  }
  geo.computeVertexNormals();
  return geo;
}

function buildCar(paint) {
  const car = new THREE.Group();
  const dark = paint.getHSL({}).l < 0.25;
  const bodyMat = new THREE.MeshPhysicalMaterial({ color: paint, metalness: dark ? 0.35 : 0.15, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.06 });
  const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x0b0d12, metalness: 0.2, roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.02 });
  const trimMat = new THREE.MeshStandardMaterial({ color: 0x15161a, roughness: 0.6 });
  const tireMat = new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 0.85 });
  const rimMat = new THREE.MeshStandardMaterial({ color: 0xc9ccd2, metalness: 0.9, roughness: 0.25 });

  // lower body side profile (x: length, y: height). front at +x
  const s = new THREE.Shape();
  s.moveTo(-2.18, 0.3);
  s.lineTo(-1.78, 0.3);
  s.absarc(-1.36, 0.36, 0.42, Math.PI, 0, true);
  s.lineTo(0.95, 0.3);
  s.absarc(1.38, 0.36, 0.42, Math.PI, 0, true);
  s.lineTo(2.12, 0.3);
  s.quadraticCurveTo(2.3, 0.32, 2.3, 0.52);
  s.quadraticCurveTo(2.29, 0.7, 2.12, 0.76);
  s.quadraticCurveTo(1.5, 0.84, 0.92, 0.9);
  s.lineTo(-1.42, 0.92);
  s.quadraticCurveTo(-2.0, 0.93, -2.16, 0.86);
  s.quadraticCurveTo(-2.3, 0.78, -2.28, 0.56);
  s.quadraticCurveTo(-2.27, 0.32, -2.18, 0.3);
  const body = new THREE.Mesh(shape3d(extrude(s, 1.62, 0.13, 10), { y0: 0.55, top: 0.16, endFrom: 1.6, endTo: 2.45, ends: 0.2, crown: 0.06, halfW: 0.94 }), bodyMat);
  body.castShadow = true;
  car.add(body);

  // greenhouse (glass)
  const gh = new THREE.Shape();
  gh.moveTo(0.98, 0.9);
  gh.quadraticCurveTo(0.55, 1.22, 0.18, 1.4);
  gh.quadraticCurveTo(0.05, 1.45, -0.15, 1.45);
  gh.lineTo(-0.85, 1.44);
  gh.quadraticCurveTo(-1.05, 1.43, -1.2, 1.32);
  gh.quadraticCurveTo(-1.55, 1.08, -1.72, 0.93);
  gh.lineTo(0.98, 0.9);
  const glass = new THREE.Mesh(shape3d(extrude(gh, 1.42, 0.1, 8), { y0: 0.9, top: 0.42, endFrom: 0.5, endTo: 2.2, ends: 0.12, crown: 0, halfW: 0.8 }), glassMat);
  glass.castShadow = true;
  car.add(glass);

  // roof panel in body colour
  const rf = new THREE.Shape();
  rf.moveTo(0.1, 1.38);
  rf.quadraticCurveTo(0.0, 1.47, -0.15, 1.47);
  rf.lineTo(-0.85, 1.46);
  rf.quadraticCurveTo(-1.0, 1.45, -1.1, 1.37);
  rf.lineTo(0.1, 1.38);
  const roof = new THREE.Mesh(shape3d(extrude(rf, 1.2, 0.1, 8), { y0: 0.9, top: 0.42, endFrom: 0.5, endTo: 2.2, ends: 0.12, crown: 0, halfW: 0.7 }), bodyMat);
  roof.position.y = 0.035;
  car.add(roof);

  // pillars in body colour (A and C) - thin slabs at the glass edges
  // B pillar
  const bp = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.46, 1.36), trimMat);
  bp.position.set(-0.32, 1.17, 0);
  car.add(bp);

  // lower trim / side skirts
  const skirt = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.07, 1.82), trimMat);
  skirt.position.set(0.0, 0.32, 0);
  car.add(skirt);

  // wheels
  const tireGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.26, 48);
  tireGeo.rotateX(Math.PI / 2);
  const rimGeo = new THREE.CylinderGeometry(0.235, 0.235, 0.04, 40);
  rimGeo.rotateX(Math.PI / 2);
  const hubGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.06, 20);
  hubGeo.rotateX(Math.PI / 2);
  for (const x of [-1.36, 1.38]) {
    for (const zs of [-1, 1]) {
      const w = new THREE.Group();
      const t = new THREE.Mesh(tireGeo, tireMat); t.castShadow = true; w.add(t);
      const r = new THREE.Mesh(rimGeo, rimMat); r.position.z = zs * 0.12; w.add(r);
      for (let k = 0; k < 5; k++) {
        const sp = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.2, 0.03), new THREE.MeshStandardMaterial({ color: 0x2a2c31, roughness: 0.5 }));
        sp.position.z = zs * 0.145;
        sp.rotation.z = (k / 5) * Math.PI * 2;
        sp.translateY(0.11);
        w.add(sp);
      }
      const h = new THREE.Mesh(hubGeo, rimMat); h.position.z = zs * 0.15; w.add(h);
      w.position.set(x, 0.36, zs * 0.82);
      car.add(w);
    }
  }

  // headlights / taillights
  const hlMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff4e6, emissiveIntensity: 0.9, roughness: 0.2 });
  const tlMat = new THREE.MeshStandardMaterial({ color: 0xc8200e, emissive: 0xa0160a, emissiveIntensity: 0.6, roughness: 0.3 });
  for (const zs of [-1, 1]) {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.08, 0.46), hlMat);
    hl.position.set(2.36, 0.66, zs * 0.55); hl.rotation.z = -0.5; car.add(hl);
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.46), tlMat);
    tl.position.set(-2.36, 0.74, zs * 0.55); car.add(tl);
    // mirrors
    const mr = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.1, 0.16), bodyMat);
    mr.position.set(0.72, 1.0, zs * 0.92); car.add(mr);
  }
  // grille
  const gr = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.14, 0.8), trimMat);
  gr.position.set(2.42, 0.46, 0); car.add(gr);
  return car;
}

window.renderCar = async (hex, view, w, h, rot) => {
  window.ROT = rot;
  for (const c of scene.children.filter(o => o.userData.car)) scene.remove(c);
  const car = buildCar(new THREE.Color(hex));
  car.userData.car = true;
  scene.add(car);
  renderer.setSize(w, h);
  let cam;
  if (view === 'top') {
    const a = w / h, H = 5.4;
    cam = new THREE.OrthographicCamera(-H * a / 2, H * a / 2, H / 2, -H / 2, 0.1, 50);
    cam.position.set(0, 20, 0);
    cam.up.set(1, 0, 0); // front of the car points up in the image
    cam.lookAt(0, 0, 0);
    ground.visible = false; contact.visible = false; contact2.visible = false;
    car.children.forEach(m => { m.castShadow = false; });
  } else {
    ground.visible = false; contact.visible = true; contact2.visible = true;
    const aspect = w / h;
    const H = 3.5;
    cam = new THREE.OrthographicCamera(-H * aspect / 2, H * aspect / 2, H / 2, -H / 2, 0.1, 100);
    // three-quarter view, front of the car pointing to the bottom-left
    cam.position.set(7.5, 4.4, 11.5);
    cam.lookAt(0, 0.7, 0);
    car.rotation.y = window.ROT == null ? -2.0 : window.ROT;
    contact.rotation.z = contact2.rotation.z = car.rotation.y;
  }
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
</body></html>
